<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="An empty elementary school graduation ceremony hall after the ceremony">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8efe0"/>
      <stop offset="0.56" stop-color="#ead8bb"/>
      <stop offset="1" stop-color="#d8c19b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b57c"/>
      <stop offset="1" stop-color="#9a7148"/>
